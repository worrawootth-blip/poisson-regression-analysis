<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>วิเคราะห์ถดถอยขั้นสูงและการวัดซ้ำ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#5d6679;--bd:#dde2ee;--pr:#2f5bea;--prt:#fff;--ok:#16794a;--bad:#c0392b;--warn:#b7791f;--th:#eaeffc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1c212d;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#2f3748;--pr:#6b8cff;--prt:#0b1020;--ok:#4cd08d;--bad:#ff7b6b;--warn:#f0b955;--th:#262e42}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1c212d;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#2f3748;--pr:#6b8cff;--prt:#0b1020;--ok:#4cd08d;--bad:#ff7b6b;--warn:#f0b955;--th:#262e42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun",system-ui,sans-serif;line-height:1.65;font-size:16px}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.2rem;margin:0 0 .6em}h3{font-size:1.02rem;margin:1em 0 .4em}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.step{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--pr);color:var(--prt);align-items:center;justify-content:center;font-size:.85rem;margin-right:8px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px}
button:hover{border-color:var(--pr)}
button.on{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
button.main{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:700;padding:11px 24px}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=file],select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;max-width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;margin:3px}
.hint{color:var(--mu);font-size:.9rem}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:420px}
th,td{border:1px solid var(--bd);padding:6px 10px;text-align:right;white-space:nowrap}
th{background:var(--th)}th:first-child,td:first-child{text-align:left}
.expl{background:var(--bg);border-left:4px solid var(--pr);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.95rem}
.expl p{margin:.4em 0}
.good{color:var(--ok);font-weight:600}.badc{color:var(--bad);font-weight:600}.warnc{color:var(--warn);font-weight:600}
.chartbox{background:#fff;border-radius:10px;border:1px solid var(--bd);padding:8px;height:430px;position:relative;overflow-x:auto}
.chartbox canvas{max-width:100%}
.err{color:var(--bad);font-weight:600;margin-top:8px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="row" style="justify-content:flex-end"><button id="lgTH" class="on">ไทย</button><button id="lgEN">English</button></div>
<h1>🧮 <span data-th="วิเคราะห์ถดถอยขั้นสูงและการวัดซ้ำ" data-en="Advanced Regression and Repeated-Measures Analysis"></span></h1>
<p class="sub" data-th="เลือกวิธีวิเคราะห์ให้เหมาะกับลักษณะข้อมูล แนบไฟล์ Excel แล้วรับตารางสถิติ คำอธิบาย และกราฟ ข้อมูลประมวลผลในเบราว์เซอร์เท่านั้น" data-en="Choose the method that fits your data, upload an Excel file and get statistical tables, explanations and charts. All data is processed in your browser only."></p>

<div class="card"><h2><span class="step">1</span><span data-th="เลือกวิธีวิเคราะห์" data-en="Select the analysis"></span></h2>
<div class="row" id="mBtns">
<button data-m="pois" class="on"><span data-th="Poisson Regression (Y เป็นจำนวนนับ)" data-en="Poisson Regression (count Y)"></span></button>
<button data-m="nb"><span data-th="Negative Binomial Regression (จำนวนนับแบบ Overdispersion)" data-en="Negative Binomial Regression (overdispersed counts)"></span></button>
<button data-m="mv"><span data-th="Multivariate Regression (Y หลายตัว)" data-en="Multivariate Regression (several Y)"></span></button>
<button data-m="rm"><span data-th="Repeated Measures ANOVA" data-en="Repeated Measures ANOVA"></span></button>
<button data-m="mx"><span data-th="Mixed ANOVA (ระหว่าง × ภายในบุคคล)" data-en="Mixed ANOVA (between × within)"></span></button>
<button data-m="ml"><span data-th="Multilevel Model (Random Intercept / Slope)" data-en="Multilevel Model (Random Intercept / Slope)"></span></button>
</div>
<div class="expl" id="mDesc"></div></div>

<div class="card"><h2><span class="step">2</span><span data-th="แนบไฟล์ข้อมูล Excel" data-en="Upload your Excel data file"></span></h2>
<input type="file" id="file" accept=".xlsx,.xls,.csv">
<p class="hint" data-th="แถวแรกเป็นชื่อตัวแปร (อ่านจากชีตแรก) รองรับ .xlsx .xls .csv" data-en="The first row must contain variable names (first sheet is read). Supports .xlsx .xls .csv"></p>
<div class="row"><button id="sampleBtn" data-th="🧪 ทดสอบด้วยข้อมูลตัวอย่าง" data-en="🧪 Try with sample data"></button><button id="sampleDl" data-th="⬇ ดาวน์โหลดไฟล์ Excel ตัวอย่าง" data-en="⬇ Download sample Excel file"></button></div>
<div id="varBox" class="hide">
<h3 data-th="เลือกตัวแปร" data-en="Select variables"></h3>
<div id="varArea"></div>
<p class="hint" id="fileInfo"></p>
</div></div>

<div class="card"><h2><span class="step">3</span><span data-th="ประมวลผล" data-en="Process"></span></h2>
<div class="row"><button class="main" id="runBtn" disabled data-th="▶ ประมวลผล" data-en="▶ Process"></button><button class="danger" id="resetBtn" data-th="⟲ Reset หน้า" data-en="⟲ Reset page"></button></div>
<div class="err" id="err"></div></div>

<div id="out" class="hide">
<div class="card" id="secA"></div>
<div class="card" id="secB"></div>
<div class="card" id="secC"></div>
<div class="card"><h2 data-th="ดาวน์โหลดผลลัพธ์" data-en="Download results"></h2><button class="main" id="xlsBtn" data-th="⬇ ดาวน์โหลดตารางเป็น Excel (.xlsx)" data-en="⬇ Download tables as Excel (.xlsx)"></button></div>
<div class="card"><h2 data-th="กราฟ" data-en="Charts"></h2><p class="hint" data-th="เลือกกราฟที่ต้องการดู" data-en="Choose a chart to view"></p>
<div class="row" id="chartBtns"></div>
<div class="chartbox" style="margin-top:12px" id="chartBox"></div>
<div class="expl" id="chartExpl"></div>
<button class="main" id="pngBtn" data-th="⬇ ดาวน์โหลดกราฟเป็น PNG" data-en="⬇ Download chart as PNG"></button></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const S={test:'all',headers:[],data:[],numCols:[],res:null,chart:null,chartKey:null,tables:{}};
const f=(x,d=4)=>x==null||!isFinite(x)?(x===Infinity?'∞':'-'):Number(x).toFixed(d);
const fp=p=>p==null||isNaN(p)?'-':(p<0.001?'<0.001':p.toFixed(4));

/* ---------- special functions ---------- */
function lgam(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const v of c)s+=v/++y;return -t+Math.log(2.5066282746310005*s/x)}
function gP(a,x){if(x<=0)return 0;if(x<a+1){let ap=a,sum=1/a,del=sum;for(let n=0;n<500;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-14)break}return sum*Math.exp(-x+a*Math.log(x)-lgam(a))}
let b=x+1-a,c=1e300,d=1/b,h=d;for(let i=1;i<500;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-14)break}return 1-Math.exp(-x+a*Math.log(x)-lgam(a))*h}
function bcf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-300)d=1e-300;d=1/d;let h=d;for(let m=1;m<500;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-300)d=1e-300;c=1+aa/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-300)d=1e-300;c=1+aa/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-14)break}return h}
function bI(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgam(a+b)-lgam(a)-lgam(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bcf(a,b,x)/a:1-bt*bcf(b,a,1-x)/b}
const chiP=(x,df)=>x<=0?1:1-gP(df/2,x/2);
const fP=(F,d1,d2)=>F<=0?1:bI(d2/(d2+d1*F),d2/2,d1/2);
const tP=(t,df)=>bI(df/(df+t*t),df/2,.5);

/* ---------- linear algebra / OLS ---------- */
function inv(A){const n=A.length,M=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>+(i===j))]);for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;if(Math.abs(M[p][i])<1e-11)return null;[M[i],M[p]]=[M[p],M[i]];const d=M[i][i];for(let j=0;j<2*n;j++)M[i][j]/=d;for(let r=0;r<n;r++)if(r!==i){const m=M[r][i];if(m)for(let j=0;j<2*n;j++)M[r][j]-=m*M[i][j]}}return M.map(r=>r.slice(n))}
function ols(X,y){const n=X.length,p=X[0].length;const XtX=Array.from({length:p},()=>Array(p).fill(0)),Xty=Array(p).fill(0);for(let i=0;i<n;i++)for(let a=0;a<p;a++){Xty[a]+=X[i][a]*y[i];for(let b=0;b<p;b++)XtX[a][b]+=X[i][a]*X[i][b]}
const I=inv(XtX);if(!I)return null;const beta=I.map(r=>r.reduce((s,v,j)=>s+v*Xty[j],0));const fit=X.map(r=>r.reduce((s,v,j)=>s+v*beta[j],0));const res=y.map((v,i)=>v-fit[i]);const my=y.reduce((a,b)=>a+b,0)/n;const SSE=res.reduce((s,e)=>s+e*e,0),SST=y.reduce((s,v)=>s+(v-my)*(v-my),0);const k=p-1,dfe=n-p;const R2=SST>0?1-SSE/SST:0;const MSE=SSE/dfe;const se=I.map((r,i)=>Math.sqrt(Math.max(MSE*r[i],0)));const t=beta.map((b,i)=>b/se[i]);const pv=t.map(v=>tP(v,dfe));const F=(R2/k)/((1-R2)/dfe);return{beta,fit,res,SSE,SST,R2,adj:1-(1-R2)*(n-1)/dfe,MSE,se,t,pv,F,pF:fP(F,k,dfe),k,dfe,n,my}}
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))};
const corr=(a,b)=>{const ma=mean(a),mb=mean(b);let sab=0,saa=0,sbb=0;for(let i=0;i<a.length;i++){sab+=(a[i]-ma)*(b[i]-mb);saa+=(a[i]-ma)**2;sbb+=(b[i]-mb)**2}return sab/Math.sqrt(saa*sbb)};
function aux(cols,z){/* regress z on columns (with intercept); returns R2 and F info */const n=z.length;const X=Array.from({length:n},(_,i)=>[1,...cols.map(c=>c[i])]);const r=ols(X,z);if(!r)return null;return{R2:r.R2,q:cols.length,n,F:(r.R2/cols.length)/((1-r.R2)/(n-cols.length-1)),SSR:r.SST-r.SSE,SST:r.SST}}

/* ================= infra ================= */
S.method='pois';S.raw=[];
let LANG='th';const L=(th,en)=>LANG==='th'?th:en;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chk=id=>[...document.querySelectorAll('#'+id+' input:checked')].map(c=>+c.value);
const opts=(ix,sel)=>ix.map(i=>`<option value="${i}"${i===sel?' selected':''}>${esc(S.headers[i])}</option>`).join('');
const zp=z=>chiP(z*z,1);
function tcrit(df){let lo=0,hi=1000;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(tP(m,df)>0.05)lo=m;else hi=m}return(lo+hi)/2}
function det(M){const n=M.length,A=M.map(r=>[...r]);let d=1;for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;if(Math.abs(A[p][i])<1e-300)return 0;if(p!==i){[A[i],A[p]]=[A[p],A[i]];d=-d}d*=A[i][i];for(let r=i+1;r<n;r++){const q=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=q*A[i][c]}}return d}
const ok=t=>`<span class="good">${t}</span>`,bad=t=>`<span class="badc">${t}</span>`,wn=t=>`<span class="warnc">${t}</span>`;
const sg=p=>p<0.05;
const pT=p=>p<0.001?'<0.001':'= '+f(p,4);
const tbl=(name,h,rows)=>{S.tables[name]=[h,...rows];return `<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};
const ex=h=>`<div class="expl">${h}</div>`;
function toast(t,bad){let el=$('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:90%;padding:10px 18px;border-radius:10px;font-weight:600;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.25)';document.body.appendChild(el)}el.textContent=t;el.style.background=bad?'#c0392b':'#16794a';el.style.color='#fff';el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',5000)}

/* ---------- language ---------- */
function mDesc(){return{
 pois:L('<b>ใช้เมื่อ:</b> Y เป็นจำนวนนับ (0, 1, 2, …) เช่น จำนวนครั้งที่เกิดอุบัติเหตุ จำนวนผู้ป่วย จำนวนข้อร้องเรียน | <b>รูปแบบข้อมูล:</b> 1 แถว = 1 หน่วย (เช่น ถนน 1 สาย/1 เดือน) คอลัมน์ Y เป็นจำนวนเต็มไม่ติดลบ และมีตัวแปรอิสระ X ได้หลายตัว เลือกตัวแปร Exposure (เช่น ปริมาณการจราจร ระยะเวลาที่เฝ้าสังเกต) ได้หากต้องการวิเคราะห์อัตรา','<b>Use when:</b> Y is a count (0, 1, 2, …) such as number of accidents, patients or complaints | <b>Data layout:</b> 1 row = 1 unit (e.g. one road or one month); Y is a non-negative integer column plus any number of predictors X. Optionally choose an exposure variable (e.g. traffic volume or observation time) to model rates.'),
 mv:L('<b>ใช้เมื่อ:</b> มีตัวแปรตาม Y หลายตัวที่สัมพันธ์กัน เช่น คะแนนคณิตศาสตร์ การอ่าน วิทยาศาสตร์ พร้อมกัน | <b>รูปแบบข้อมูล:</b> 1 แถว = 1 ราย เลือก Y ตั้งแต่ 2 ตัวขึ้นไป และ X อย่างน้อย 1 ตัว','<b>Use when:</b> you have several correlated dependent variables Y analysed together, e.g. math, reading and science scores | <b>Data layout:</b> 1 row = 1 case; choose 2 or more Y variables and at least 1 X.'),
 rm:L('<b>ใช้เมื่อ:</b> วัดคนเดิมซ้ำหลายครั้ง (เช่น ก่อน/หลังการทดลอง ติดตามผลหลายช่วงเวลา) และอยากทดสอบว่าค่าเฉลี่ยเปลี่ยนไปตามการวัดหรือไม่ | <b>รูปแบบข้อมูล (แนวกว้าง Wide):</b> 1 แถว = 1 คน แต่ละคอลัมน์ = การวัด 1 ครั้ง เลือกคอลัมน์การวัดตั้งแต่ 2 คอลัมน์ขึ้นไป','<b>Use when:</b> the same subjects are measured repeatedly (e.g. pre/post or follow-ups) and you want to test whether the mean changes across measurements | <b>Data layout (wide):</b> 1 row = 1 subject, each column = one measurement; choose 2 or more measurement columns.'),
 ml:L('<b>ใช้เมื่อ:</b> ข้อมูลซ้อนเป็นกลุ่ม เช่น นักเรียนในโรงเรียน หรือการวัดซ้ำหลายครั้งในคนเดิม และต้องการแยกความแปรปรวนระหว่างกลุ่มกับภายในกลุ่ม | <b>รูปแบบข้อมูล (แนวยาว Long):</b> 1 แถว = 1 การสังเกต มีคอลัมน์รหัสกลุ่ม/รหัสบุคคล (Cluster ID) คอลัมน์ Y และ X (ถ้าเป็นการวัดซ้ำ ให้ใส่ตัวแปรเวลาเป็น X) เลือก Random Slope ของตัวแปรอิสระได้','<b>Use when:</b> data are nested, e.g. students within schools or repeated measures within persons, and you want to separate between-group from within-group variance | <b>Data layout (long):</b> 1 row = 1 observation with a cluster/person ID column, a Y column and X columns (for repeated measures, include time as an X). A random slope for a predictor can be added.'),nb:L('<b>ใช้เมื่อ:</b> Y เป็นจำนวนนับที่มี <u>Overdispersion</u> (ความแปรปรวนมากกว่าค่าเฉลี่ย) ซึ่ง Poisson ใช้ไม่ได้ เช่น จำนวนอุบัติเหตุที่กระจุกตัวเป็นบางพื้นที่ | <b>รูปแบบข้อมูล:</b> เหมือน Poisson (1 แถว = 1 หน่วย, Y เป็นจำนวนเต็มไม่ติดลบ, เลือก Exposure ได้) เว็บจะเปรียบเทียบกับ Poisson ให้','<b>Use when:</b> Y is a count with <u>overdispersion</u> (variance larger than the mean) so Poisson is inadequate, e.g. accident counts clustered in certain places | <b>Data layout:</b> same as Poisson (1 row = 1 unit, Y a non-negative integer, optional exposure); the page compares the result with Poisson.'),mx:L('<b>ใช้เมื่อ:</b> มีทั้งปัจจัยระหว่างบุคคล (เช่น กลุ่มควบคุม/กลุ่มทดลอง) และการวัดซ้ำในคนเดิม และต้องการทดสอบปฏิสัมพันธ์ กลุ่ม × เวลา | <b>รูปแบบข้อมูล (แนวกว้าง):</b> 1 แถว = 1 คน มีคอลัมน์กลุ่ม (ข้อความหรือรหัสตัวเลข) และคอลัมน์การวัดซ้ำตั้งแต่ 2 คอลัมน์ขึ้นไป','<b>Use when:</b> there is both a between-subject factor (e.g. control/treatment) and repeated measures on the same subjects, and you want to test the group × time interaction | <b>Data layout (wide):</b> 1 row = 1 subject with a group column (text or numeric code) and 2 or more repeated-measure columns.')}[S.method]}
function applyStatic(){document.documentElement.lang=LANG;document.title=L('เครื่องมือวิเคราะห์ถดถอยขั้นสูงและการวัดซ้ำ','Advanced Regression and Repeated-Measures Analysis Tool');document.querySelectorAll('[data-th]').forEach(e=>e.textContent=e.dataset[LANG]);$('mDesc').innerHTML=mDesc()}
function setLang(l){LANG=l;$('lgTH').classList.toggle('on',l==='th');$('lgEN').classList.toggle('on',l==='en');applyStatic();updateInfo();if(S.info)buildVars(true);if(S.res){const k=S.chartKey;render(S.res);if(S.charts.some(c=>c.k===k))showChart(k)}}

/* ---------- file loading ---------- */
$('file').onchange=async e=>{const file=e.target.files[0];$('err').textContent='';if(!file)return;
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});loadRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null,raw:true}),wb.SheetNames[0],false)}
  catch(x){$('err').textContent=L('อ่านไฟล์ไม่สำเร็จ: ','Could not read file: ')+x.message}};
function loadRows(rows,sheet,sample){
  try{
    if(rows.length<4)throw new Error(L('ข้อมูลน้อยเกินไป','Too little data'));
    const hd=rows[0].map((h,i)=>h==null||h===''?'Var'+(i+1):String(h));
    const data=rows.slice(1).filter(r=>r.some(v=>v!=null&&v!==''));
    const num=v=>{if(typeof v==='number')return v;if(typeof v==='string'&&v.trim()!==''&&isFinite(v.replace(/,/g,'')))return +v.replace(/,/g,'');return null};
    S.raw=data.map(r=>hd.map((_,i)=>r[i]==null?null:r[i]));S.data=data.map(r=>hd.map((_,i)=>num(r[i])));S.headers=hd;
    S.numCols=hd.map((_,i)=>i).filter(i=>S.data.filter(r=>r[i]!=null).length>=0.7*data.length);
    if(!S.numCols.length)throw new Error(L('ไม่พบคอลัมน์ตัวเลข','No numeric columns found'));
    S.info={rows:data.length,cols:S.numCols.length,sheet,sample};updateInfo();buildVars();
    $('varBox').classList.remove('hide');$('runBtn').disabled=false;
  }catch(x){$('err').textContent=L('อ่านไฟล์ไม่สำเร็จ: ','Could not read file: ')+x.message;$('varBox').classList.add('hide');$('runBtn').disabled=true}}
function updateInfo(){const i=S.info;if(!i)return;$('fileInfo').textContent=L(`อ่านข้อมูลสำเร็จ: ${i.rows} แถว, ${i.cols} คอลัมน์ตัวเลข (ชีต: ${i.sheet})`,`Loaded: ${i.rows} rows, ${i.cols} numeric columns (sheet: ${i.sheet})`)+(i.sample?L(' ใช้ข้อมูลตัวอย่าง กดประมวลผลได้เลย',' Sample data in use; just press Process'):'')}

/* ---------- variable pickers ---------- */
function boxes(id,ix,sel){return `<span id="${id}">${ix.map(i=>`<label class="chk"><input type="checkbox" value="${i}"${sel(i)?' checked':''}>${esc(S.headers[i])}</label>`).join('')}</span>`}
function buildVars(keep){
  const m=S.method,nc=S.numCols,all=S.headers.map((_,i)=>i),sel=id=>$(id)&&$(id).value!==''?+$(id).value:null;
  const prev={y:sel('ySel'),e:$('expSel')?$('expSel').value:'',c:sel('clSel'),g:sel('gSel'),rs:$('rsSel')?$('rsSel').value:'',ctr:$('ctr')?$('ctr').checked:true,ch:{}};
  ['xBox','yBox','rBox'].forEach(id=>{if($(id))prev.ch[id]=new Set(chk(id))});
  const pc=(id,i,def)=>keep&&prev.ch[id]?prev.ch[id].has(i):def;
  let h='';
  if(m==='pois'||m==='nb'){const y=keep&&prev.y!=null?prev.y:nc[0];h=`<div>${L('ตัวแปรตาม Y (จำนวนนับ):','Dependent variable Y (count):')} <select id="ySel">${opts(nc,y)}</select></div><div style="margin-top:8px">${L('ตัวแปรอิสระ (X):','Independent variables (X):')} <span id="xHold"></span></div><div style="margin-top:8px">${L('ตัวแปร Exposure (ไม่บังคับ):','Exposure variable (optional):')} <select id="expSel"><option value="">—</option>${opts(nc,keep&&prev.e!==''?+prev.e:-1)}</select></div>`}
  else if(m==='mv'){const ny=Math.min(3,Math.max(2,Math.ceil(nc.length/2)));h=`<div>${L('ตัวแปรตาม (Y) เลือก 2 ตัวขึ้นไป:','Dependent variables (Y), choose 2 or more:')} ${boxes('yBox',nc,i=>pc('yBox',i,nc.indexOf(i)<ny))}</div><div style="margin-top:8px">${L('ตัวแปรอิสระ (X):','Independent variables (X):')} ${boxes('xBox',nc,i=>pc('xBox',i,nc.indexOf(i)>=ny))}</div>`}
  else if(m==='rm'){h=`<div>${L('คอลัมน์การวัดซ้ำ (เรียงตามลำดับเวลา เลือก 2 ตัวขึ้นไป):','Repeated-measure columns (in time order, choose 2 or more):')} ${boxes('rBox',nc,i=>pc('rBox',i,true))}</div>`}
  else if(m==='mx'){h=`<div>${L('ปัจจัยระหว่างบุคคล (คอลัมน์กลุ่ม):','Between-subject factor (group column):')} <select id="gSel">${opts(all,keep&&prev.g!=null?prev.g:0)}</select></div><div style="margin-top:8px">${L('คอลัมน์การวัดซ้ำ (เรียงตามเวลา เลือก 2 ตัวขึ้นไป):','Repeated-measure columns (in time order, choose 2 or more):')} <span id="xHold"></span></div>`}
  else{const c=keep&&prev.c!=null?prev.c:0,y=keep&&prev.y!=null?prev.y:(nc.find(i=>i!==c)??nc[0]);h=`<div>${L('รหัสกลุ่ม/บุคคล (Cluster ID):','Cluster / person ID:')} <select id="clSel">${opts(all,c)}</select></div><div style="margin-top:8px">${L('ตัวแปรตาม Y:','Dependent variable Y:')} <select id="ySel">${opts(nc,y)}</select></div><div style="margin-top:8px">${L('ตัวแปรอิสระ (X) ระดับ 1:','Level-1 predictors (X):')} <span id="xHold"></span></div><div style="margin-top:8px">${L('Random Slope (ไม่บังคับ):','Random slope (optional):')} <select id="rsSel"></select> <label class="chk"><input type="checkbox" id="ctr" checked>${L('ปรับค่ากลาง (Center) ตัวแปรนี้','Center this variable')}</label></div>`}
  $('varArea').innerHTML=h;
  if($('xHold')){$('xHold').outerHTML='<span id="xWrap"></span>';if(m==='mx')refreshMX(keep?prev.ch.rBox:null);else refreshX(keep?prev.ch.xBox:null)}
  ['ySel','expSel','clSel'].forEach(id=>{if($(id))$(id).onchange=()=>refreshX(new Set(chk('xBox')))});
  if($('gSel'))$('gSel').onchange=()=>refreshMX(new Set(chk('rBox')));
  if(m==='ml'){if(keep&&prev.rs)$('rsSel').value=prev.rs;$('ctr').checked=prev.ctr}
  ['yBox','xBox'].forEach(id=>{if($(id)&&m==='mv')$(id).onchange=syncMV});if(m==='mv')syncMV()}
function refreshX(prevSet){const ex=['ySel','expSel','clSel'].map(id=>$(id)&&$(id).value!==''?+$(id).value:null);const ix=S.numCols.filter(i=>!ex.includes(i));$('xWrap').innerHTML=boxes('xBox',ix,i=>prevSet?prevSet.has(i):true);if(S.method==='ml'){$('xBox').onchange=refreshRS;refreshRS()}}
function refreshRS(){const s=$('rsSel');if(!s)return;const prev=s.value;s.innerHTML=`<option value="">${L('ไม่มี (Random Intercept อย่างเดียว)','None (random intercept only)')}</option>`+chk('xBox').map(i=>`<option value="${i}"${String(i)===prev?' selected':''}>${esc(S.headers[i])}</option>`).join('')}
function refreshMX(prevSet){const gcol=+$('gSel').value;$('xWrap').innerHTML=boxes('rBox',S.numCols.filter(i=>i!==gcol),i=>prevSet?prevSet.has(i):true)}
function syncMV(){const y=new Set(chk('yBox')),x=new Set(chk('xBox'));document.querySelectorAll('#yBox input').forEach(c=>c.disabled=x.has(+c.value));document.querySelectorAll('#xBox input').forEach(c=>c.disabled=y.has(+c.value))}

/* ================= POISSON ================= */
function glm(X,y,off){const n=y.length,p=X[0].length,sy=y.reduce((a,c)=>a+c,0),so=off?off.reduce((s,v)=>s+Math.exp(v),0):n;let b=Array(p).fill(0);b[0]=Math.log(Math.max(sy,.5)/so);
  const lin=()=>X.map((r,i)=>Math.min(30,Math.max(-30,r.reduce((s,v,j)=>s+v*b[j],0)+(off?off[i]:0))));
  const wx=mu=>{const A=Array.from({length:p},()=>Array(p).fill(0));for(let i=0;i<n;i++)for(let a=0;a<p;a++)for(let c=0;c<p;c++)A[a][c]+=mu[i]*X[i][a]*X[i][c];return A};
  let conv=false;
  for(let it=0;it<100;it++){const eta=lin(),mu=eta.map(Math.exp),A=wx(mu),c=Array(p).fill(0);
    for(let i=0;i<n;i++){const z=eta[i]-(off?off[i]:0)+(y[i]-mu[i])/mu[i];for(let a=0;a<p;a++)c[a]+=mu[i]*X[i][a]*z}
    const I=inv(A);if(!I)return null;const nb=I.map(r=>r.reduce((s,v,j)=>s+v*c[j],0));const d=Math.max(...nb.map((v,j)=>Math.abs(v-b[j])));b=nb;if(d<1e-10){conv=true;break}}
  const eta=lin(),mu=eta.map(Math.exp),I=inv(wx(mu));if(!I)return null;return{b,I,mu,conv}}
function calcPois(y,xs,names,yn,off){
  const n=y.length,k=xs.length,p=k+1,X=y.map((_,i)=>[1,...xs.map(c=>c[i])]);const g=glm(X,y,off);
  if(!g)throw new Error(L('ประมาณแบบจำลองไม่ได้ (ตัวแปรอิสระอาจสัมพันธ์กันสมบูรณ์หรือเป็นค่าคงที่)','Cannot fit the model (predictors may be perfectly collinear or constant)'));
  const {b,I,mu}=g,se=I.map((r,i)=>Math.sqrt(r[i]));
  const ll=y.reduce((s,v,i)=>s+v*Math.log(mu[i])-mu[i]-lgam(v+1),0);
  const dev=2*y.reduce((s,v,i)=>s+(v>0?v*Math.log(v/mu[i]):0)-(v-mu[i]),0);
  const sy=y.reduce((a,c)=>a+c,0),so=off?off.reduce((s,v)=>s+Math.exp(v),0):n,mu0=y.map((_,i)=>sy/so*(off?Math.exp(off[i]):1));
  const ll0=y.reduce((s,v,i)=>s+v*Math.log(mu0[i])-mu0[i]-lgam(v+1),0),dev0=2*y.reduce((s,v,i)=>s+(v>0?v*Math.log(v/mu0[i]):0)-(v-mu0[i]),0);
  const LR=2*(ll-ll0),pear=y.reduce((s,v,i)=>s+(v-mu[i])**2/mu[i],0),dfr=n-p,disp=pear/dfr;
  const z=y.map((v,i)=>((v-mu[i])**2-v)/mu[i]),sm2=mu.reduce((s,v)=>s+v*v,0),al=mu.reduce((s,v,i)=>s+v*z[i],0)/sm2,s2=z.reduce((s,v,i)=>s+(v-al*mu[i])**2,0)/(n-1),ct=al/(Math.sqrt(s2)/Math.sqrt(sm2));
  const qd=Math.max(disp,1);
  const coef=b.map((v,i)=>({nm:i?names[i-1]:'(Intercept)',b:v,se:se[i],z:v/se[i],p:zp(v/se[i]),lo:v-1.96*se[i],hi:v+1.96*se[i],irr:Math.exp(v),ilo:Math.exp(v-1.96*se[i]),ihi:Math.exp(v+1.96*se[i]),pq:zp(v/(se[i]*Math.sqrt(qd)))}));
  const ym=mean(y),yv=sd(y)**2,mx=Math.max(...y);
  const cats=[];for(let v=0;v<=Math.min(mx,15);v++)cats.push({v,obs:y.filter(t=>t===v).length,exp:mu.reduce((s,m)=>s+Math.exp(v*Math.log(m)-m-lgam(v+1)),0)});
  return{n,k,p,yn,names,y,xs,mu,coef,ll,ll0,dev,dev0,LR,LRp:chiP(LR,k),mcf:1-ll/ll0,aic:-2*ll+2*p,bic:-2*ll+p*Math.log(n),pear,dfr,disp,al,ct,ctp:tP(ct,n-1),
    zeros:y.filter(v=>v===0).length,zexp:mu.reduce((s,m)=>s+Math.exp(-m),0),ym,yv,mx,cats,pres:y.map((v,i)=>(v-mu[i])/Math.sqrt(mu[i])),conv:g.conv,hasOff:!!off}}
function anPois(nb){const yi=+$('ySel').value,xi=chk('xBox'),ei=$('expSel').value===''?null:+$('expSel').value;
  if(!xi.length)throw new Error(L('กรุณาเลือกตัวแปรอิสระอย่างน้อย 1 ตัว','Please select at least 1 independent variable'));
  const idx=[yi,...xi,...(ei!=null?[ei]:[])],rows=S.data.filter(r=>idx.every(i=>r[i]!=null));
  if(rows.length<xi.length+6)throw new Error(L('ข้อมูลที่สมบูรณ์น้อยเกินไป','Too few complete cases'));
  const y=rows.map(r=>r[yi]);if(y.some(v=>v<0||!Number.isInteger(v)))throw new Error(L('Y ต้องเป็นจำนวนนับ (จำนวนเต็มไม่ติดลบ)','Y must be a count (non-negative integers)'));
  if(ei!=null&&rows.some(r=>r[ei]<=0))throw new Error(L('Exposure ต้องมากกว่า 0','Exposure must be greater than 0'));
  const R=(nb?calcNB:calcPois)(y,xi.map(i=>rows.map(r=>r[i])),xi.map(i=>S.headers[i]),S.headers[yi],ei!=null?rows.map(r=>Math.log(r[ei])):null);R.dropped=S.data.length-rows.length;R.expName=ei!=null?S.headers[ei]:null;
  R.desc=[[R.yn,y],...xi.map(i=>[S.headers[i],rows.map(r=>r[i])])].map(([nm,a])=>({nm,n:a.length,mean:mean(a),sd:sd(a),min:Math.min(...a),max:Math.max(...a)}));
  S.extra={name:'Fitted',aoa:[['No','Y','Fitted mean','Pearson residual'],...y.map((v,i)=>[i+1,v,R.mu[i],R.pres[i]])]};return R}
function cntA(R){const dn=L('ตารางที่ ','Table ');
  $('secA').innerHTML=`<h2>${L('ข้อมูลเบื้องต้น','Data Overview')}</h2><p class="hint">${L('ตัวแปรตาม','Dependent variable')}: <b>${esc(R.yn)}</b> | n = ${R.n}${R.dropped?L(` (ตัดแถวไม่ครบ ${R.dropped})`,` (${R.dropped} incomplete rows removed)`):''}${R.expName?' | Exposure: <b>'+esc(R.expName)+'</b>':''}</p>
  <h3>${dn}1 ${L('สถิติเชิงพรรณนา','Descriptive statistics')}</h3>${tbl(L('สถิติเชิงพรรณนา','Descriptives'),[L('ตัวแปร','Variable'),'n','Mean','SD','Min','Max'],R.desc.map(d=>[esc(d.nm),d.n,f(d.mean),f(d.sd),f(d.min),f(d.max)]))}
  <h3>${dn}2 ${L('การแจกแจงของ Y','Distribution of Y')}</h3>${tbl(L('การแจกแจง Y','Y distribution'),[L('ค่าเฉลี่ย','Mean'),L('ความแปรปรวน','Variance'),'Variance / Mean',L('จำนวนค่าศูนย์','Zeros'),L('% ค่าศูนย์','% zeros'),'Max'],[[f(R.ym),f(R.yv),f(R.yv/R.ym,3),R.zeros,f(R.zeros/R.n*100,1)+'%',R.mx]])}
  ${ex(`<p>${L('Poisson Regression ตั้งอยู่บนข้อตกลงว่า <b>ค่าเฉลี่ยเท่ากับความแปรปรวน</b> (Equidispersion) ดังนั้นค่า Variance / Mean ควรใกล้ 1 ถ้าสูงกว่า 1 มากแสดงว่ามี Overdispersion ซึ่งจะทำให้ Standard Error ต่ำเกินจริง','Poisson regression assumes the <b>mean equals the variance</b> (equidispersion), so Variance / Mean should be close to 1. A much larger value signals overdispersion, which makes the standard errors too small.')}</p>`)}`;}
function rPois(R){cntA(R);const dn=L('ตารางที่ ','Table ');
  const eq='ln(μ) = '+f(R.coef[0].b,3)+R.coef.slice(1).map(c=>(c.b>=0?' + ':' − ')+f(Math.abs(c.b),3)+'·'+esc(c.nm)).join('');
  const sgn=R.coef.slice(1).filter(c=>sg(c.p)),top=sgn.length?sgn.reduce((a,c)=>c.p<a.p?c:a):null;

function rao(Lm,p,q,v){const t=p*p+q*q-5>0?Math.sqrt((p*p*q*q-4)/(p*p+q*q-5)):1,w=v-(p-q+1)/2,df1=p*q,df2=w*t-df1/2+1,lt=Math.pow(Lm,1/t),F=(1-lt)/lt*df2/df1;return{F,df1,df2,p:df2>0?fP(F,df1,df2):NaN}}
function sscp(R){const q=R.length,E=Array.from({length:q},()=>Array(q).fill(0));for(let a=0;a<q;a++)for(let b=0;b<q;b++)E[a][b]=R[a].reduce((s,v,i)=>s+v*R[b][i],0);return E}
function calcMV(Ys,yn,xs,names){
  const q=Ys.length,k=xs.length,n=Ys[0].length,dfe=n-k-1,X=Ys[0].map((_,i)=>[1,...xs.map(c=>c[i])]);
  const ms=Ys.map(y=>ols(X,y));if(ms.some(m=>!m))throw new Error(L('ประมาณแบบจำลองไม่ได้ (ตัวแปรอิสระอาจสัมพันธ์กันสมบูรณ์)','Cannot fit the model (predictors may be perfectly collinear)'));
  const E=sscp(ms.map(m=>m.res)),dE=det(E);
  const tests=names.map((nm,l)=>{const Xr=X.map(r=>r.filter((_,j)=>j!==l+1)),Er=sscp(Ys.map(y=>ols(Xr,y).res)),Lm=dE/det(Er),r=rao(Lm,q,1,dfe);return{nm,Lm,V:1-Lm,T:(1-Lm)/Lm,F:r.F,df1:r.df1,df2:r.df2,p:r.p,eta:1-Lm}});
  const E0=sscp(Ys.map(y=>{const m=mean(y);return y.map(v=>v-m)})),L0=dE/det(E0),ov=rao(L0,q,k,dfe);
  const sdx=xs.map(sd),rc=E.map((r,a)=>r.map((v,b)=>v/Math.sqrt(E[a][a]*E[b][b])));
  const all=[...Ys,...xs],cn=[...yn,...names];
  return{n,q,k,dfe,yn,names,Ys,xs,ms,E,tests,ov:{Lm:L0,...ov,eta:1-L0},rc,cn,cm:all.map(a=>all.map(b=>corr(a,b))),sdx,sdy:Ys.map(sd),
    desc:all.map((a,j)=>({nm:cn[j],n,mean:mean(a),sd:sd(a),min:Math.min(...a),max:Math.max(...a)}))}}
function anMV(){const yi=chk('yBox'),xi=chk('xBox');if(yi.length<2)throw new Error(L('กรุณาเลือกตัวแปรตาม (Y) อย่างน้อย 2 ตัว','Please select at least 2 dependent variables'));if(!xi.length)throw new Error(L('กรุณาเลือกตัวแปรอิสระอย่างน้อย 1 ตัว','Please select at least 1 independent variable'));
  const rows=S.data.filter(r=>[...yi,...xi].every(i=>r[i]!=null));if(rows.length<xi.length+yi.length+4)throw new Error(L('ข้อมูลที่สมบูรณ์น้อยเกินไป','Too few complete cases'));
  const R=calcMV(yi.map(i=>rows.map(r=>r[i])),yi.map(i=>S.headers[i]),xi.map(i=>rows.map(r=>r[i])),xi.map(i=>S.headers[i]));R.dropped=S.data.length-rows.length;
  S.extra={name:'Residuals',aoa:[['No',...R.yn.map(y=>y+' (resid)')],...R.Ys[0].map((_,i)=>[i+1,...R.ms.map(m=>m.res[i])])]};return R}

function calcRM(D,names){
  const n=D.length,m=names.length,cm=Array.from({length:m},(_,j)=>mean(D.map(r=>r[j]))),sm=D.map(r=>mean(r)),G=mean(cm);
  const SSc=n*cm.reduce((s,v)=>s+(v-G)**2,0),SSs=m*sm.reduce((s,v)=>s+(v-G)**2,0),SSt=D.reduce((s,r)=>s+r.reduce((a,v)=>a+(v-G)**2,0),0),SSe=SSt-SSs-SSc;
  const df1=m-1,df2=(n-1)*(m-1),MSc=SSc/df1,MSe=SSe/df2,F=MSc/MSe;
  const S2=Array.from({length:m},(_,a)=>Array.from({length:m},(_,b)=>D.reduce((s,r)=>s+(r[a]-cm[a])*(r[b]-cm[b]),0)/(n-1)));
  const rmn=S2.map(r=>mean(r)),gm=mean(rmn),Sx=S2.map((r,a)=>r.map((v,b)=>v-rmn[a]-rmn[b]+gm));
  let gg=1,hf=1,W=NaN,mp=NaN,mchi=NaN,mdf=0;
  if(m>=3){const t1=Sx.reduce((s,r,a)=>s+r[a],0),t2=Sx.reduce((s,r)=>s+r.reduce((a,v)=>a+v*v,0),0);gg=Math.max(1/(m-1),Math.min(1,t1*t1/((m-1)*t2)));hf=Math.min(1,(n*(m-1)*gg-2)/((m-1)*(n-1-(m-1)*gg)));
    const C=Array.from({length:m},()=>Array(m-1).fill(0));for(let r=1;r<m;r++){for(let i=0;i<r;i++)C[i][r-1]=1/Math.sqrt(r*(r+1));C[r][r-1]=-r/Math.sqrt(r*(r+1))}
    const M=Array.from({length:m-1},(_,a)=>Array.from({length:m-1},(_,b)=>{let s=0;for(let i=0;i<m;i++)for(let j=0;j<m;j++)s+=C[i][a]*S2[i][j]*C[j][b];return s}));
    const p=m-1,tr=M.reduce((s,r,a)=>s+r[a],0);W=det(M)/Math.pow(tr/p,p);mdf=p*(p+1)/2-1;const d=(2*p*p+p+2)/(6*p*(n-1));mchi=-(n-1)*(1-d)*Math.log(W);mp=chiP(mchi,mdf)}
  const tc=tcrit(n-1),desc=names.map((nm,j)=>{const s=sd(D.map(r=>r[j])),se=s/Math.sqrt(n);return{nm,n,mean:cm[j],sd:s,se,lo:cm[j]-tc*se,hi:cm[j]+tc*se}});
  const pairs=[];for(let a=0;a<m;a++)for(let b=a+1;b<m;b++){const d=D.map(r=>r[a]-r[b]),md=mean(d),sdd=sd(d),se=sdd/Math.sqrt(n),t=md/se,p=tP(t,n-1);pairs.push({a:names[a],b:names[b],md,se,t,p,pb:Math.min(1,p*m*(m-1)/2),dz:md/sdd,lo:md-tc*se,hi:md+tc*se})}
  const cr=names.map((_,a)=>names.map((_,b)=>corr(D.map(r=>r[a]),D.map(r=>r[b]))));
  const row=(df,e)=>({df1:df1*e,df2:df2*e,p:fP(F,df1*e,df2*e)});
  return{n,m,names,D,cm,desc,SSc,SSs,SSe,SSt,df1,df2,MSc,MSe,F,eta:SSc/(SSc+SSe),geta:SSc/(SSc+SSs+SSe),gg,hf,W,mp,mchi,mdf,pairs,cn:names,cmx:cr,cmM:cr,p0:row(df1,1),pg:row(df1,gg),ph:row(df1,hf)}}
function anRM(){const ci=chk('rBox');if(ci.length<2)throw new Error(L('กรุณาเลือกคอลัมน์การวัดอย่างน้อย 2 คอลัมน์','Please select at least 2 measurement columns'));
  const rows=S.data.filter(r=>ci.every(i=>r[i]!=null));if(rows.length<=ci.length)throw new Error(L('จำนวนผู้เข้าร่วมที่ข้อมูลครบต้องมากกว่าจำนวนการวัด','Complete subjects must outnumber the measurements'));
  const R=calcRM(rows.map(r=>ci.map(i=>r[i])),ci.map(i=>S.headers[i]));R.dropped=S.data.length-rows.length;R.cm=R.cmx;
  S.extra={name:'Data',aoa:[['Subject',...R.names],...R.D.map((r,i)=>[i+1,...r])]};return R}

  const gdiff=names.map((nm,t)=>{const yt=D.map(r=>r[t]),a=ols(Xf,yt),b=ols(X1,yt),F=((b.SSE-a.SSE)/(g-1))/(a.SSE/ne),pv=fP(F,g-1,ne);return{nm,F,p:pv,pb:Math.min(1,pv*m)}});
  const within=keys.map((kv,j)=>{const Dg=D.filter((_,i)=>gi[i]===j),r=calcRM(Dg,names),pp=m>=3?r.pg.p:r.p0.p;return{key:String(kv),n:Dg.length,F:r.F,df1:r.df1,df2:r.df2,p:r.p0.p,pg:pp,eta:r.eta,pb:Math.min(1,pp*g)}});
  return{n,m,g,names,keys:keys.map(String),grp,D,gName,ng,Gr,SSeb,dfeb,T,TG,SSEw,dfEw,MSe,gg,hf,W,mp,mchi,mdf,p,Fl,pl:fP(Fl,dfg,dfeb),cells,gdiff,within,gi}}

function heat(cv){const R=S.res,N=R.cn.length,cs=Math.max(54,Math.min(90,Math.floor(560/N))),ml=130,mt=110,W=ml+cs*N+20,H=mt+cs*N+20;cv.width=W;cv.height=H;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#222';x.font='bold 15px sans-serif';x.textAlign='left';x.fillText(L('Heatmap เมทริกซ์สหสัมพันธ์ (r)','Correlation matrix heatmap (r)'),10,22);
